name: Deploy Front-End App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site with Vite
        run: bun run build

      - name: List directory structure to find build output
        run: |
          echo "=== Root directory contents ==="
          ls -la

      - name: Verify build directory & create 404.html fallback
        run: |
          if [ -d "dist" ]; then
            cp dist/index.html dist/404.html
            echo "BUILD_PATH=dist" >> $GITHUB_ENV
          elif [ -d "build" ]; then
            cp build/index.html build/404.html
            echo "BUILD_PATH=build" >> $GITHUB_ENV
          else
            echo "Build failed to output dist or build directory."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./${{ env.BUILD_PATH }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
