# Build the TanStack Start app as a static SPA and publish it to GitHub Pages.
# Repo Settings → Pages → Source must be "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build
        env:
          GITHUB_PAGES: "true"
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Prepare GitHub Pages files
        id: static
        run: |
          if [ -f dist/client/index.html ]; then
            OUT=dist/client
          elif [ -f dist/index.html ]; then
            OUT=dist
          elif [ -f .output/public/index.html ]; then
            OUT=.output/public
          elif [ -f .output/public/_shell.html ]; then
            OUT=.output/public
            cp "$OUT/_shell.html" "$OUT/index.html"
          else
            echo "Static HTML output not found"
            find dist .output -name '*.html' 2>/dev/null | head -50
            exit 1
          fi
          echo "Using output directory: $OUT"
          echo "pages_dir=$OUT" >> "$GITHUB_OUTPUT"
          cp "$OUT/index.html" "$OUT/404.html"
          touch "$OUT/.nojekyll"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.static.outputs.pages_dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
